<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Outer circular ribbon: Vivid fiery orange with bright specular sheen -->
    <linearGradient id="fav-ring" x1="10" y1="12" x2="92" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5EB"/>
      <stop offset="18%" stop-color="#FFA245"/>
      <stop offset="42%" stop-color="#FF5E00"/>
      <stop offset="70%" stop-color="#D94800"/>
      <stop offset="85%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FFA033"/>
    </linearGradient>

    <!-- Inner Q loop: White apex into brilliant tangerine and flame orange -->
    <linearGradient id="fav-q" x1="30" y1="22" x2="74" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE0B2"/>
      <stop offset="55%" stop-color="#FF7A00"/>
      <stop offset="85%" stop-color="#FF5000"/>
      <stop offset="100%" stop-color="#CC3E00"/>
    </linearGradient>

    <!-- Ring highlight -->
    <linearGradient id="fav-highlight" x1="18" y1="8" x2="76" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Q Tail: Electric golden yellow down into deep flame orange -->
    <linearGradient id="fav-tail" x1="38" y1="52" x2="90" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="28%" stop-color="#FFB703"/>
      <stop offset="70%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#E04000"/>
    </linearGradient>

    <filter id="fav-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="fav-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FF5500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- OUTER CIRCULAR RIBBON -->
  <g filter="url(#fav-shadow)">
    <path
      d="
        M 77 21
        C 91 33
          96 52
          89 69
        C 82 87
          63 95
          44 91
        C 25 88
          10 73
          8 54
        C 6 35
          17 18
          34 11
        C 50 4
          68 9
          77 21
      "
      stroke="url(#fav-ring)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Top highlight stroke -->
    <path
      d="M 18 29 C 30 10 58 5 77 21"
      stroke="url(#fav-highlight)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
  </g>

  <!-- INNER LETTER Q -->
  <g filter="url(#fav-glow)">
    <!-- Main Q Oval Loop -->
    <path
      d="
        M 50 24
        C 64 24 74 34 74 48
        C 74 62 64 72 50 72
        C 36 72 26 62 26 48
        C 26 34 36 24 50 24
      "
      stroke="url(#fav-q)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Dynamic Flowing Q Tail -->
    <path
      d="
        M 42 54
        C 50 62 60 70 69 77
        C 76 81 83 81 88 69
      "
      stroke="url(#fav-tail)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner specular sheen -->
    <path
      d="M 34 37 C 37 29 44 26 50 26 C 56 26 63 29 66 37"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.8"
    />
  </g>

  <!-- Overlap ribbon accent -->
  <path
    d="M 61 74 C 70 80 80 79 87 68"
    stroke="#FFA726"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.6"
  />
</svg>
